[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fun-time"
version = "0.1.0"
# The version every gate runs, and the one the family's machine runs: a floor
# lower than what a run proves is a promise nothing backs.
requires-python = ">=3.14"
# The three family siblings -- funestra (the Funestras' engine, which brings
# python-mpv; its DLL lives in %USERPROFILE%\.haglio\libmpv), app_support and
# shared_ui -- are listed first below, each at the tag this repo was built
# against, and [tool.haglio] siblings still names them for the gates.
# Every requirement carries a ceiling. Without one each run installs whatever
# PyPI served that morning: this repo's venv holds opencv-python 4 and the gate
# was installing opencv-python 5, so the imaging stack the Funestras stand on was
# a different major version in CI than in production. Floors are what this
# repo's venv holds today.
# The family repos this one runs are named at the tags it was built against
# rather than left to be whatever checkouts sit beside it. Unpinned, a change
# landing in one of them reached every consumer the same minute, and one whose
# other half had not landed turned all of them red at once. Moving to a newer
# one is this repo's own commit, with its own suite to answer for it.
dependencies = [
    "app-support @ git+https://github.com/haglio/app_support@v0.1.335",
    "funestra @ git+https://github.com/haglio/funestra@v0.1.646",
    "shared-ui @ git+https://github.com/haglio/shared_ui@v0.1.293",
    # The family's listener: it brings vosk and sounddevice, and hears for this
    # app, Evolver's backfill tool and Origenerator alike.
    "voice-core @ git+https://github.com/haglio/voice_core@v0.1.99",
    "numpy>=2.4,<3",
    "opencv-python>=4.8,<5",
    "pillow>=12,<13",
    "pygame-ce>=2,<3",
    "PyQt6>=6,<7",
    # The FunTimeVR stack: OpenXR loader bindings, GL, and the hidden window
    # that carries the GL context.  Imported only on VR code paths, but listed
    # here (not as an extra) so one venv serves both apps and CI's import
    # completeness check stays simple.
    "pyopenxr>=1,<2",
    "PyOpenGL>=3,<4",
    "glfw>=2,<3",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6,<7",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-timeout>=2.4,<3",
    "ruff==0.16.6",
    "vulture>=2.16,<3",
]
# The verifying listener a spoken command waits for (voice_core's whisper reader).
# Without it the first listener's word stands, as it did before there was a verifying listener.
voice = [
    "faster-whisper>=1,<2",
]
# The RFB slideshow reaches Chrome's tabs through comtypes.  A marker rather than a
# plain dependency: it is Windows-only and this pyproject is read on other platforms.
windows = [
    "comtypes>=1.4.17,<2 ; sys_platform == 'win32'",
]

# The family checkouts this one is installed beside. None is published, so none
# can go in [project.dependencies]; the family's dependency gate holds this
# list against the tree, counting what a declared sibling needs in turn.
[tool.haglio]
siblings = ["app_support", "funestra", "shared_ui", "voice_core"]

# What the family's gates (app_support.gates) let stand here, each for the
# reason beside it. An entry nothing is reported for any more fails the gate.
[tool.haglio.dead-code]
# The packages are scanned one at a time: scanned together they hide each
# other's dead code, vulture matching by bare name across all it is handed.
each-package-alone = true
# CommandFiles.funestra_file asks for a side's file by kind, so the two the
# satellites' channels take that way are read by getattr rather than by name.
unread-dataclass-fields = ["CommandFiles.portrait_hud_file", "CommandFiles.landscape_hud_file"]

# What this repo does not unit-test, with the reason it gives. One place, never
# a pragma scattered through the tree.
[tool.haglio.coverage]
not-unit-tested = [
    { path = "fun_time/chrome_accessibility.py", because = "reaches a real Chrome's tabs: needs a browser" },
    { path = "fun_time/win32_events.py", because = "listens to the presses and carets of a real desktop" },
    { path = "satellite/app.py", because = "a Funestra's shell: needs the playback engine's library" },
    { path = "fun_time_vr/gl_contexts.py", because = "needs a graphics context" },
    { path = "fun_time_vr/app.py", because = "the headset's shell: needs a headset" },
    { path = "fun_time_vr/render.py", because = "needs a graphics context" },
    { path = "fun_time_vr/video_thread.py", because = "needs a graphics context" },
    { path = "fun_time_vr/vr_session.py", because = "needs a headset and a graphics context" },
    { path = "fun_time_vr/windows_sound.py", because = "sets Windows' default sound devices: a test would change the machine's" },
]

# What Fun Time's three launchers start: launch.vbs, the file the pinned shortcut
# runs; launch_vr.vbs, FunTimeVR's; and launch_branch.vbs, which a
# "Verify <branch>" shortcut runs on a worktree. All three are rendered from
# these by `python -m app_support.launcher --write`.
[tool.haglio.launchers."launch.vbs"]
app = "Fun Time"
run = "-m fun_time.orchestrator"
named-interpreter = "FunTime-Orchestrator.exe"
log = 'state\launcher.log'
watch = true
loading-screen = ["Updating Fun Time...", "Updating Origenerator..."]

[tool.haglio.launchers."launch_vr.vbs"]
app = "FunTimeVR"
run = "-m fun_time_vr.orchestrator"
log = 'state\vr_launcher.log'
watch = true

[tool.haglio.launchers."launch_branch.vbs"]
app = "Fun Time"
run = '-m fun_time.branch_session "{checkout}"'
log = 'state\launcher.log'
watch = true
note = 'branch_out_of_date.txt'
loading-screen = ["Updating Fun Time...", "Updating Origenerator..."]
preview = true

[tool.haglio.launchers."launch_branch.vbs".checkout-argument]
missing = """
There is nothing to run here on its own.

An agent with a branch for you to look at leaves a "Verify <branch>" shortcut \
in this folder, and names it for you. Double-click that instead."""
gone = """
That branch's worktree is gone:
{checkout}

It was probably deleted when the branch landed, in which case the work is \
already in Fun Time. This shortcut can be deleted."""

[tool.haglio.launchers."launch_branch.vbs".checkout-argument.flags."--vr"]
app = "Fun Time VR"
log = 'state\vr_launcher.log'

[tool.haglio.launchers."launch_main_verifier.vbs"]
app = "Fun Time main verifier"
interpreter = "pythonw.exe"
run = "-m tests.integration.main_verifier"
# The machine's own upkeep, which the production updater never waits for.
environment = { HAGLIO_UPKEEP = "1" }

# What the production updater (app_support.production_update) needs to know of
# this checkout. Production Fun Time moves only to a commit the main verifier
# passed, which it writes into commit-file. Fun Time starts the hosted
# Origenerator out of Origenerator's own checkout rather than through its
# launcher, so Origenerator is never updated while Fun Time runs. Declaring the
# table at all also makes every launcher here bring this checkout up, and wait
# out an update of it or of Origenerator, before it starts what it starts.
[tool.haglio.production]
commit-file = 'state\main_verifier_passed.txt'
also-runs = ["origenerator"]

# What a hotfix runs before production takes it (app_support.hotfix), beside the
# tests its branch changed: every entry point still imports as its launcher starts it.
[tool.haglio.hotfix]
checks = ["tests/test_launch_smoke.py"]

# What Fun Time relies on Windows to keep: the shortcut it is pinned from, kept in
# this checkout to pin from and in the Start menu, and the Start menu's shortcut
# into the headset. `python -m app_support.windows_settings --write` makes this
# machine match every checkout's list.
[tool.haglio.shortcuts."Fun Time"]
launcher = "launch.vbs"
icon = "icon.ico"
app-id = "FunTime.App"
places = ["taskbar", "start-menu", "checkout"]

[tool.haglio.shortcuts."Fun Time VR"]
launcher = "launch_vr.vbs"
icon = "vr_icon.ico"
app-id = "FunTime.App"
places = ["start-menu"]

[tool.haglio.scheduled-tasks."Fun Time main verifier"]
launcher = "launch_main_verifier.vbs"
every-minutes = 5

# Four top-level packages share this repo — the orchestrator, the Main Funestra
# and the Satellite Funestra it launches as `python -m main_funestra` and
# `python -m satellite`, and the FunTimeVR variant.  Setuptools' automatic
# flat-layout discovery refuses more than one, so declare them explicitly.
[tool.setuptools.packages.find]
include = ["fun_time*", "main_funestra*", "satellite*", "fun_time_vr*"]

# Only the syntax level, so a ruff run outside the suite reads the code the way
# the venv and CI do.  The rules are not configured here on purpose: the
# family's dead-code gate in app_support.gates names the ones it enforces, so
# a bare `ruff check` cannot quietly become the gate.

# The pytest settings live HERE, not in a pytest.ini beside it, because pytest
# takes its whole configuration from ONE file and a caller may name that file.
# `-c pyproject.toml` is the natural thing to pass in a worktree, and with the
# settings in a separate pytest.ini it silently selected a config with no
# addopts, no testpaths and no norecursedirs: it dropped the sanitize plugin and
# the timeout, and it swept tests/integration/ into an ordinary unit run — which
# put the suite's real Funestras, the Main Funestra and AHK bridge on the user's monitors, on
# top of his work.  One file means the explicit `-c` and bare discovery cannot
# disagree.  tests/test_pytest_config.py holds it here.
[tool.pytest.ini_options]
# A ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here is the launcher-import children at about a second. 240 s is
# chosen to clear the 180 s guards on the child processes in
# tests/test_win32_loader.py and tests/test_launch_smoke.py, so a wedged child
# fails with the message written for it rather than with a generic stack dump.
# --timeout-method=thread is the half that pays for itself: it dumps the stack
# of the test that stopped, which turns a stalled required check into a
# one-line diagnosis.
# app_support.gates holds all three halves of it.
addopts = "-p no:cacheprovider --timeout=240 --timeout-method=thread -p app_support.sanitize.pytest_plugin -p app_support.gates.pytest_plugin -p app_support.coverage_gate --cov --cov-report="
testpaths = ["tests"]
markers = [
    "real_startup_waits: this test is about a startup wait, so it gets the real window lookup and the real timeouts instead of the conftest stubs.",
]
# `integration` is the load-bearing one: it is what keeps the integration suite
# out of an ordinary unit run.  It is a convenience, not the guard — the guard
# is tests/integration/conftest.py, which refuses whenever an integration test
# is collected off the hidden desktop, however the run was invoked.
norecursedirs = [
    "archive", "state", "integration",
    ".tmp-pytest-local", ".tmp-pytest-fresh", ".tmp-pytest-int", ".tmp-pytest-int-one",
    "pytest-cache-files-*",
]
