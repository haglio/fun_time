[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fun-time"
version = "0.1.0"
requires-python = ">=3.10"
# The shared siblings are NOT listed here — ../player_core (the satellite
# players' engine, which brings python-mpv and the libmpv DLL), ../app_support
# (logging, threading, CLI and subprocess scaffolding) and ../shared_ui. Each is
# installed editable from a local path (see their READMEs) and none is
# published, so pip would go looking for them on PyPI.
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "pygame-ce",
    "PyQt6",
    # The FunTimeVR stack: OpenXR loader bindings, GL, and the hidden window
    # that carries the GL context.  Imported only on VR code paths, but listed
    # here (not as an extra) so one venv serves both apps and CI's import
    # completeness check stays simple.
    "pyopenxr",
    "PyOpenGL",
    "glfw",
]

[project.optional-dependencies]
dev = [
    "hypothesis",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
    "vulture",
]
voice = [
    "vosk",
    "sounddevice",
]

# Three top-level packages share this repo — the orchestrator, the satellite
# player it launches as `python -m satellite`, and the FunTimeVR variant.
# Setuptools' automatic flat-layout discovery refuses more than one, so
# declare them explicitly.
[tool.setuptools.packages.find]
include = ["fun_time*", "satellite*", "fun_time_vr*"]

# Only the syntax level, so a ruff run outside the suite reads the code the way
# the venv and CI do.  The rules are not configured here on purpose: the
# dead-code gate in tests/test_dead_code.py names the ones it enforces, so
# a bare `ruff check` cannot quietly become the gate.
[tool.ruff]
target-version = "py312"
