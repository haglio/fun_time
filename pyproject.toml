[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fun-time"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "pillow",
    "pygame-ce",
    "PyQt6",
]

[project.optional-dependencies]
dev = [
    "hypothesis",
    "pytest",
    "pytest-cov",
    "vulture",
]
voice = [
    "vosk",
    "sounddevice",
]
