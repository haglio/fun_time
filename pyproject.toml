[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fun-time"
version = "0.1.0"
# The version every gate runs, and the one the family's machine runs: a floor
# lower than what a run proves is a promise nothing backs.
requires-python = ">=3.14"
# The three family siblings -- player_core (the players' engine, which brings
# python-mpv; its DLL lives in %LOCALAPPDATA%\haglio\libmpv), app_support and
# shared_ui -- are listed first below, each at the tag this repo was built
# against, and [tool.haglio] siblings still names them for the gates.
# Every requirement carries a ceiling. Without one each run installs whatever
# PyPI served that morning: this repo's venv holds opencv-python 4 and the gate
# was installing opencv-python 5, so the imaging stack the players stand on was
# a different major version in CI than in production. Floors are what this
# repo's venv holds today.
# The family repos this one runs are named at the tags it was built against
# rather than left to be whatever checkouts sit beside it. Unpinned, a change
# landing in one of them reached every consumer the same minute, and one whose
# other half had not landed turned all of them red at once. Moving to a newer
# one is this repo's own commit, with its own suite to answer for it.
dependencies = [
    "app-support @ git+https://github.com/haglio/app_support@v0.1.156",
    "player-core @ git+https://github.com/haglio/player_core@v0.1.295",
    "shared-ui @ git+https://github.com/haglio/shared_ui@v0.1.129",
    # The family's listener: it brings vosk and sounddevice, and hears for this
    # app, Evolver's backfill tool and Origenerator alike.
    "voice-core @ git+https://github.com/haglio/voice_core@v0.1.14",
    "numpy>=2.4,<3",
    "opencv-python>=4.8,<5",
    "pillow>=12,<13",
    "pygame-ce>=2,<3",
    "PyQt6>=6,<7",
    # The FunTimeVR stack: OpenXR loader bindings, GL, and the hidden window
    # that carries the GL context.  Imported only on VR code paths, but listed
    # here (not as an extra) so one venv serves both apps and CI's import
    # completeness check stays simple.
    "pyopenxr>=1,<2",
    "PyOpenGL>=3,<4",
    "glfw>=2,<3",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6,<7",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-timeout>=2.4,<3",
    "ruff==0.16.6",
    "vulture>=2.16,<3",
]
# The second listener a spoken command waits for (voice_core's whisper reader).
# Without it the first listener's word stands, as it did before there was a second.
voice = [
    "faster-whisper>=1,<2",
]
# The windows bridge reads .lnk files through win32com, and this was installed
# by a bare `pip install pywin32` line in the merge gate and declared nowhere --
# invisible to the import gate, which exempts an import inside a try, and that
# import sits in one. A marker rather than a plain dependency: the package is
# Windows-only and this pyproject is read on other platforms.
windows = [
    "pywin32>=312,<313 ; sys_platform == 'win32'",
]

# The family checkouts this one is installed beside. None is published, so none
# can go in [project.dependencies]; tests/test_dependency_completeness.py holds
# this list against the tree, counting what a declared sibling needs in turn.
[tool.haglio]
siblings = ["app_support", "player_core", "shared_ui", "voice_core"]

# What Fun Time's three launchers start: launch.vbs, the file the pinned shortcut
# runs; launch_vr.vbs, FunTimeVR's; and launch_branch.vbs, which a
# "Verify <branch>" shortcut runs on a worktree. All three are rendered from
# these by `python -m app_support.launcher --write`.
[tool.haglio.launchers."launch.vbs"]
app = "Fun Time"
run = "-m fun_time.orchestrator"
named-interpreter = "FunTime-Orchestrator.exe"
log = 'state\launcher.log'
watch = true

[tool.haglio.launchers."launch_vr.vbs"]
app = "FunTimeVR"
run = "-m fun_time_vr.orchestrator"
log = 'state\vr_launcher.log'
watch = true

[tool.haglio.launchers."launch_branch.vbs"]
app = "Fun Time"
run = '-m fun_time.branch_session "{checkout}"'
log = 'state\launcher.log'
watch = true
note = 'branch_out_of_date.txt'

[tool.haglio.launchers."launch_branch.vbs".checkout-argument]
missing = """
There is nothing to run here on its own.

An agent with a branch for you to look at leaves a "Verify <branch>" shortcut \
in this folder, and names it for you. Double-click that instead."""
gone = """
That branch's worktree is gone:
{checkout}

It was probably deleted when the branch landed, in which case the work is \
already in Fun Time. This shortcut can be deleted."""

[tool.haglio.launchers."launch_branch.vbs".checkout-argument.flags."--vr"]
app = "Fun Time VR"
log = 'state\vr_launcher.log'

# Four top-level packages share this repo — the orchestrator, the main player
# and the satellite player it launches as `python -m main_player` and
# `python -m satellite`, and the FunTimeVR variant.  Setuptools' automatic
# flat-layout discovery refuses more than one, so declare them explicitly.
[tool.setuptools.packages.find]
include = ["fun_time*", "main_player*", "satellite*", "fun_time_vr*"]

# Only the syntax level, so a ruff run outside the suite reads the code the way
# the venv and CI do.  The rules are not configured here on purpose: the
# dead-code gate in tests/test_dead_code.py names the ones it enforces, so
# a bare `ruff check` cannot quietly become the gate.

# The pytest settings live HERE, not in a pytest.ini beside it, because pytest
# takes its whole configuration from ONE file and a caller may name that file.
# `-c pyproject.toml` is the natural thing to pass in a worktree, and with the
# settings in a separate pytest.ini it silently selected a config with no
# addopts, no testpaths and no norecursedirs: it dropped the sanitize plugin and
# the timeout, and it swept tests/integration/ into an ordinary unit run — which
# put the suite's real players, the main player and AHK bridge on the user's monitors, on
# top of his work.  One file means the explicit `-c` and bare discovery cannot
# disagree.  tests/test_pytest_config.py holds it here.
[tool.pytest.ini_options]
# A ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here is the launcher-import children at about a second. 240 s is
# chosen to clear the 180 s guards on the child processes in
# tests/test_win32_loader.py and tests/test_launch_smoke.py, so a wedged child
# fails with the message written for it rather than with a generic stack dump.
# --timeout-method=thread is the half that pays for itself: it dumps the stack
# of the test that stopped, which turns a stalled required check into a
# one-line diagnosis.
# tests/test_timeouts.py holds all three halves of it.
addopts = "-p no:cacheprovider --timeout=240 --timeout-method=thread -p app_support.sanitize.pytest_plugin -p app_support.coverage_gate --cov --cov-report="
testpaths = ["tests"]
markers = [
    "real_startup_waits: this test is about a startup wait, so it gets the real window lookup and the real timeouts instead of the conftest stubs.",
]
# `integration` is the load-bearing one: it is what keeps the integration suite
# out of an ordinary unit run.  It is a convenience, not the guard — the guard
# is tests/integration/conftest.py, which refuses whenever an integration test
# is collected off the hidden desktop, however the run was invoked.
norecursedirs = [
    "archive", "state", "integration",
    ".tmp-pytest-local", ".tmp-pytest-fresh", ".tmp-pytest-int", ".tmp-pytest-int-one",
    "pytest-cache-files-*",
]
