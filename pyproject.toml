[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fun-time"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "pygame-ce",
    "PyQt6",
    "pyserial",
]

[project.optional-dependencies]
dev = [
    "hypothesis",
    "pytest",
    "pytest-cov",
    "vulture",
]
voice = [
    "vosk",
    "sounddevice",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
norecursedirs = [
    "archive",
    "state",
    "integration",
    ".tmp-pytest-local",
    ".tmp-pytest-fresh",
    ".tmp-pytest-int",
    ".tmp-pytest-int-one",
    "pytest-cache-files-*",
]
