<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #1e1e2e;
    color: #cdd6f4;
  }
  .container { text-align: center; max-width: 80vw; }
  .hint { color: #6c7086; margin-bottom: 1em; }
  a { color: #89b4fa; font-size: 1.1em; word-break: break-all; }
  .dest { color: #6c7086; font-size: 0.85em; margin-top: 0.8em; }
  #clip {
    display: none;
    max-width: min(320px, 70vw);
    max-height: 45vh;
    /* Revealed as a block box narrower than the text around it, so the
       container's text-align leaves it flush left; auto margins centre it. */
    margin: 0 auto 1.2em;
    border-radius: 8px;
    background: #11111b;
  }
</style>
<script>
(function() {
  // All three literals are substituted by fun_time.rfb_tab_page.render_tab_page.
  var target = "__FT_TARGET__";
  var label = "__FT_LABEL__";
  var video = "__FT_VIDEO__";
  var nav = performance.getEntriesByType('navigation')[0];
  if (nav && nav.type === 'reload') {
    location.replace(target);
    return;
  }
  document.title = label;
  document.addEventListener('DOMContentLoaded', function() {
    var link = document.getElementById('target');
    link.href = target;
    link.textContent = label;
    try {
      var parsed = new URL(target);
      document.getElementById('dest').textContent = '→ ' + parsed.host + parsed.pathname;
    } catch (e) {}
    if (video) {
      var clip = document.getElementById('clip');
      // Only reveal the clip once it can actually paint a frame — a source that
      // has been moved or deleted must not leave a black box on the page.
      clip.addEventListener('loadeddata', function() {
        clip.style.display = 'block';
        follow();
      });
      // Decode only in the tab you are looking at: the RFB opens ten at once.
      function follow() {
        if (document.hidden) clip.pause();
        else clip.play().catch(function() {});
      }
      document.addEventListener('visibilitychange', follow);
      clip.src = video;
    }
  });
})();
</script>
</head>
<body>
<div class="container">
  <video id="clip" muted loop autoplay playsinline preload="metadata"></video>
  <p class="hint">Press Ctrl+R to load, or click the link:</p>
  <a id="target" href="#"></a>
  <p class="dest" id="dest"></p>
</div>
</body>
</html>
