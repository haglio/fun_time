[pytest]
# The timeout is a ceiling, not a target: the slowest test here is the
# tracked-tree content scan at ~21 s, so 150 s clears it seven times over and can
# only bite on a hang. This suite waits on Win32 windows, threads and child
# processes, which is the shape that hangs; the thread method prints the hung
# stack, which is what turns a stalled required check into a one-line diagnosis.
# tests/test_timeouts.py holds both halves of it.
addopts = -p no:cacheprovider --timeout=150 --timeout-method=thread
testpaths = tests
markers =
    real_startup_waits: this test is about a startup wait, so it gets the real
        window lookup and the real timeouts instead of the conftest stubs.
norecursedirs = archive state integration .tmp-pytest-local .tmp-pytest-fresh .tmp-pytest-int .tmp-pytest-int-one pytest-cache-files-*
