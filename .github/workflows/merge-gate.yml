# The family's merge gate, published once in haglio/.github; this file says only what
# differs about this repo. The check the merge queue requires is `full-suite / suite`.
name: merge gate (full suite)

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      siblings: "app_support shared_ui player_core"
      python-version: "3.12"
      timeout-minutes: 15
      qt-platform: offscreen
      sdl-video: dummy
      sdl-audio: dummy
      pip-extra: pywin32
      reverse: false
      prepare: |
        set -euo pipefail
        get_url() {
          gh api "repos/$1/releases?per_page=15" \
            --jq '[.[].assets[]?.browser_download_url | select(test("mpv-dev-x86_64-[0-9].*\\.7z$"))][0] // empty'
        }
        url="$(get_url zhongfly/mpv-winbuild)"
        [ -z "$url" ] && url="$(get_url shinchiro/mpv-winbuild-cmake)"
        if [ -z "$url" ]; then echo "::error::could not resolve a libmpv dev build URL"; exit 1; fi
        echo "libmpv dev build: $url"
        curl -fL -o "$RUNNER_TEMP/mpv-dev.7z" "$url"
        7z x "$RUNNER_TEMP/mpv-dev.7z" -o"$RUNNER_TEMP/mpv-dev" >/dev/null
        dll="$(find "$RUNNER_TEMP/mpv-dev" -name 'libmpv-2.dll' | head -1)"
        if [ -z "$dll" ]; then echo "::error::libmpv-2.dll not in the archive"; exit 1; fi
        pydir="$(python -c 'import sys, os; print(os.path.dirname(sys.executable))')"
        cp "$dll" "$pydir/mpv-2.dll"
        echo "$pydir" >> "$GITHUB_PATH"
        python -c "import app_support, player_core, shared_ui, mpv; print('imports OK')"
