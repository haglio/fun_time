# The family's merge gate, published once in haglio/.github; this file says only what
# differs about this repo. The check the merge queue requires is `full-suite / suite`.
name: merge gate (full suite)

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      siblings: ""
      python-version: "3.14"
      # The install and one pass of the suite take about six minutes; the rest is
      # the ten repeats of what a pull request changed, which for a rename that
      # reaches 1,464 tests is about another fifteen. The queue itself gives up
      # on a check at 60.
      timeout-minutes: 35
      qt-platform: offscreen
      sdl-video: dummy
      sdl-audio: dummy
      extras: "dev,windows"
      # The video engine, at the build player_core's `tools/libmpv.lock` names and
      # whose digest its fetcher verifies -- the same one this repo's own startup
      # preflight tells a developer to fetch. The fetcher and the lock sit outside
      # the installed package, so the pinned tag is cloned for them; the tag is
      # this repo's own, read back off the pyproject that pins it.
      prepare: |
        set -euo pipefail
        tag="$(python -c 'from pathlib import Path; from app_support.dependencies import pinned_siblings; print(pinned_siblings(Path("pyproject.toml"))["player_core"])')"
        echo "libmpv from player_core $tag"
        git clone --quiet --depth 1 --branch "$tag" \
          https://github.com/haglio/player_core.git "$RUNNER_TEMP/player_core"
        python "$RUNNER_TEMP/player_core/tools/fetch_libmpv.py" --require
        python -c "import app_support, shared_ui; from player_core.mpv_player import _import_mpv; _import_mpv(); print('imports OK')"
